# Egypt setup. Docker Compose loads this file automatically next to docker-compose.yml.
# It mounts the Egyptian store files from this repository into the official image,
# so no custom image build is needed yet.
services:
    app:
        environment:
            APP_CURRENCY_LOCALE: ar_EG   # default currency: EGP
            APP_TIMEZONE: Africa/Cairo
            AFFILIATE_ENABLED: 'false'   # don't rewrite shop links with affiliate codes
            DEFAULT_STORES_COUNTRY: egypt  # a fresh install only creates the Egyptian shops
        volumes:
            - ./database/seeders/Stores/egypt.php:/app/database/seeders/Stores/egypt.php:ro
            - ./database/seeders/ProductSources:/app/database/seeders/ProductSources:ro
            - ./app/Console/Commands/CreateProductSources.php:/app/app/Console/Commands/CreateProductSources.php:ro
            # Mixes results from every shop in "Search via the web" (see EGYPT.md).
            - ./app/Services/SearchService.php:/app/app/Services/SearchService.php:ro
            # Saved searches: searched again on a schedule, cheapest results tracked.
            - ./database/migrations/2026_11_07_000000_create_saved_searches_table.php:/app/database/migrations/2026_11_07_000000_create_saved_searches_table.php:ro
            - ./app/Models/SavedSearch.php:/app/app/Models/SavedSearch.php:ro
            - ./app/Models/ProductSource.php:/app/app/Models/ProductSource.php:ro
            - ./app/Services/ProductSourceSearchService.php:/app/app/Services/ProductSourceSearchService.php:ro
            - ./app/Services/SavedSearchRunner.php:/app/app/Services/SavedSearchRunner.php:ro
            - ./app/Services/Helpers/ScheduleHelper.php:/app/app/Services/Helpers/ScheduleHelper.php:ro
            - ./app/Jobs/RunSavedSearchJob.php:/app/app/Jobs/RunSavedSearchJob.php:ro
            - ./app/Console/Commands/RunSavedSearches.php:/app/app/Console/Commands/RunSavedSearches.php:ro
            - ./app/Filament/Resources/SavedSearchResource.php:/app/app/Filament/Resources/SavedSearchResource.php:ro
            - ./app/Filament/Resources/SavedSearchResource:/app/app/Filament/Resources/SavedSearchResource:ro
